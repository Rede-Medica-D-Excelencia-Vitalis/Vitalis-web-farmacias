name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1' # Executa toda segunda-feira às 2h

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run security audit
        run: |
          npm audit --audit-level high
          npm audit fix --force
          
      - name: Run ESLint security rules
        run: |
          npx eslint . --ext .ts,.tsx --config .eslintrc.security.js
          
      - name: Run security tests
        run: |
          npm run test:security
          
      - name: Upload security results
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: |
            security-results.json
            cypress/screenshots
            cypress/videos
            
      - name: Security report
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "### Test Status" >> $GITHUB_STEP_SUMMARY
          if [ -f security-results.json ]; then
            echo "✅ Security tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security tests failed" >> $GITHUB_STEP_SUMMARY
          fi
