version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.security
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SECURITY_ENABLED=true
      - HTTPS_REQUIRED=true
      - CSRF_PROTECTION=true
      - XSS_PROTECTION=true
      - SQL_INJECTION_PROTECTION=true
      - LGPD_COMPLIANCE=true
      - DATA_ENCRYPTION=true
      - CONSENT_REQUIRED=true
    volumes:
      - ./security-logs:/app/logs
    networks:
      - security-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - security-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - security-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  postgres:
    image: postgres:alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vitalis_farmacias
      - POSTGRES_USER=vitalis_user
      - POSTGRES_PASSWORD=vitalis_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - security-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  trivy:
    image: aquasec/trivy:latest
    command: image --severity HIGH,CRITICAL --exit-code 1 vitalis-farmacias:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - security-network

  trufflehog:
    image: trufflesecurity/trufflehog:latest
    command: filesystem /app
    volumes:
      - .:/app
    networks:
      - security-network

networks:
  security-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
  postgres-data:
